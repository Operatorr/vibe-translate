# Model benchmark config. Each combo runs its task's standard sample prompt
# against the given model + reasoning setting and records latency, tokens,
# throughput (tok/s), and price.
#
#   pnpm bench
#
# Reads OPENROUTER_API_KEY from the environment or .dev.vars. Results print as a
# table and are saved to bench/results/.
#
# reasoning:  none      -> reasoning disabled (reasoning.enabled = false)
#             minimal | low | medium | high -> reasoning effort
#             (omit the line) -> the model's own default
# Up to 50 combos.

# Times each combo is run; latency/throughput are averaged. Default 1.
repeat = 1

# ---- translate ----------------------------------------------------------
# [[combo]]
# task = "translate"
# model = "google/gemini-3-flash-preview"
# reasoning = "medium"

[[combo]]
task = "translate"
model = "google/gemini-3-flash-preview"
reasoning = "none"

